name: CI

on:
  push:
    branches: [main, "palier/**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Qualité du code (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install ruff==0.16.10
      - name: Lint
        run: ruff check --output-format=github .
      - name: Formatage
        run: ruff format --check .

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Installation depuis un checkout propre (parcours du README)
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          $PY -m pip install --upgrade pip
          $PY -m pip install -r requirements-dev.lock
          $PY -m pip install --no-deps -e .

      - name: Tests (fixtures uniquement, aucun jeton métier)
        run: $PY -m pytest -m "not real"

      - uses: actions/setup-node@v4
        if: runner.os == 'Linux' && matrix.python == '3.14'
        with:
          node-version: "22"

      - name: Test navigateur réel (clavier, brouillons, annulation)
        if: runner.os == 'Linux' && matrix.python == '3.14'
        env:
          PALADIN_E2E: "1"
        run: $PY -m pytest tests/test_e2e.py -s

      - name: Démo et diagnostic
        env:
          PALADIN_HOME: ${{ runner.temp }}/paladin home
        run: |
          $PY -m paladin demo
          $PY -m paladin status --home "$PALADIN_HOME-demo"
          $PY -m paladin doctor --home "$PALADIN_HOME-demo"

      - name: Script de lancement (double-clic Windows / commande Linux)
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then cmd //c "Paladin.cmd --version"; else ./paladin.sh --version; fi
