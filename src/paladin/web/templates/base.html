<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Paladin{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='paladin.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Paladin</a>
    <span class="muted">v{{ version }}</span>
    {% block topbar %}{% endblock %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
