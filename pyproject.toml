[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-paladin"
version = "0.8.0"
description = "Assistant local de triage et de comparaison AppSec (Fortify, rapports MD, Excel)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn>=0.50,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1.5,<3.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
paladin = "paladin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paladin = [
    "db/migrations/*.sql",
    "fixtures/**/*",
    "web/templates/*.html",
    "web/static/*",
    "agent/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "real: test d'intégration réel opt-in (OpenCode/GLM, Fortify) — exclu de la CI",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # imports triés
    "B",        # bugbear : pièges courants
    "UP",       # syntaxe Python moderne
    "SIM",      # simplifications
    "C4",       # compréhensions
    "PIE",      # constructions inutiles
    "RUF",      # règles ruff
    "S",        # sécurité (bandit)
    "PTH",      # pathlib plutôt que os.path
    "N",        # nommage PEP 8
]
ignore = [
    "S101",     # assert : utilisé par pytest
    "RUF001", "RUF002", "RUF003",  # caractères typographiques français (’ « » —) voulus
    "S608",     # SQL construit : uniquement des fragments internes, valeurs toujours liées par paramètres
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"src/paladin/fixtures/demo/repos/**" = ["ALL"]  # code volontairement vulnérable de la démo

[tool.ruff.format]
quote-style = "double"
