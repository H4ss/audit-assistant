[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "project-paladin"
version = "0.0.1"
description = "Assistant local de triage et de comparaison AppSec (Fortify, rapports MD, Excel)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.140,<1",
    "uvicorn>=0.50,<1",
    "jinja2>=3.1,<4",
    "openpyxl>=3.1.5,<3.2",
    "python-multipart>=0.0.20",
    "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[project.scripts]
paladin = "paladin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paladin = [
    "db/migrations/*.sql",
    "fixtures/**/*",
    "web/templates/*.html",
    "web/static/*",
    "agent/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "real: test d'intégration réel opt-in (OpenCode/GLM, Fortify) — exclu de la CI",
]
